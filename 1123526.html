<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Sample Form</h1>
    <form id="myForm">
        <label for="First name:">Input 1:</label>
        <input type="text" id="First name:" name="First name:" value="Your first name"><br><br>

        <label for="input2">Input 2:</label>
        <input type="text" id="input2" name="input2" value="Default Value 2"><br><br>

        <label for="input3">Input 3:</label>
        <input type="text" id="input3" name="input3" value="Default Value 3"><br><br>

        <button type="submit">Submit</button>
        <button type="reset" onclick="resetForm()">Reset</button>
    </form>

    <script>
        function resetForm() {
            document.getElementById("myForm").reset();
            document.getElementById("input1").value = "Default Value 1";
            document.getElementById("input2").value = "Default Value 2";
            document.getElementById("input3").value = "Default Value 3";
        }
    </script>
</body>
</html>
