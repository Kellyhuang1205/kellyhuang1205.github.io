<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>Sample Form</h1>
    <form id="myForm">
        <label for="First name:">First name:</label>
        <input type="text" id="First name:" name="First name:" value="Your first name"><br><br>

        <label for="Last name:">Last name:</label>
        <input type="text" id="Last name:" name="Last name:" value="Your last name"><br><br>

        <label for="Student ID:">Student ID:</label>
        <input type="text" id="Student ID:" name="Student ID:" value="Your student ID"><br><br>

        <button type="submit">Submit</button>
        <button type="reset" onclick="resetForm()">Reset</button>
    </form>

    <script>
        function resetForm() {
            document.getElementById("myForm").reset();
            document.getElementById("First name:").value = "Your first name";
            document.getElementById("Last name:").value = "Your last name";
            document.getElementById("Student ID:").value = "Your student ID";
        }
    </script>
</body>
</html>
